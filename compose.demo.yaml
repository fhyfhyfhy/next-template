# Demo 后端用的 Postgres 和对象存储，只由 demo:* 命令启动（scripts/demo-backend/services.mjs），连接参数写在同一个文件里。
# 固定 project 名：同一台机器上的每份 checkout 共用这两个容器和它们的数据，不各起一份去抢端口。
# 都挂 named volume：数据库里记着对象的 key，只清掉一边会让封面和模型失效；docker compose down -v 会把两边一起清空。
name: next-demo

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 1s
      timeout: 3s
      retries: 30

  storage:
    image: versity/versitygw:v1.10.0
    environment:
      ROOT_ACCESS_KEY: demo-access-key
      ROOT_SECRET_KEY: demo-secret-key
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    ports:
      - "127.0.0.1:7070:7070"
    # posix 后端把对象的元数据存在 xattr 里，所以要用 named volume（在 Docker 的 Linux VM 里），不能 bind mount 到宿主机目录。
    volumes:
      - storage:/data

volumes:
  postgres:
  storage:
